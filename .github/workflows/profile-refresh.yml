name: Refresh profile cards

on:
  schedule:
    - cron: '17 16 * * *' # 00:17 Asia/Singapore
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/profile.json'
      - '.github/scripts/generate-profile.mjs'
      - '.github/workflows/profile-refresh.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: profile-cards-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Fetch verified public data and render local cards
        run: node .github/scripts/generate-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish changed assets
        run: bash .github/scripts/publish-assets.sh README.md assets/profile/public-data.json assets/profile/followers.svg assets/profile/stars.svg assets/profile/repositories.svg assets/profile/stats-*.svg assets/profile/languages-*.svg assets/profile/activity*.svg assets/profile/repositories
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
          PROFILE_ASSET_KIND: profile cards
