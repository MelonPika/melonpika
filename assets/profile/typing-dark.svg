<svg xmlns="http://www.w3.org/2000/svg" width="760" height="60" viewBox="0 0 760 60" role="img" aria-labelledby="title description"><title id="title">Animated introduction: MelonPika</title><desc id="description">Hi, I&apos;m MelonPika. A cozy corner for code &amp; curiosity. Small steps, pastel skies &amp; little experiments. Three typing lines with a 1.2-second pause; reduced-motion support.</desc><rect width="760" height="60" rx="16" fill="#0B0D12"/><style>@keyframes reveal{0%,4%{width:0}67%,88%{width:var(--line-width)}99%,100%{width:0}}@keyframes cursor{0%,4%{transform:translateX(0)}67%,88%{transform:translateX(var(--line-width))}99%,100%{transform:translateX(0)}}@keyframes line{0%,33.2%{opacity:1}33.34%,100%{opacity:0}}@keyframes blink{50%{opacity:0}}.line{opacity:0;animation:line 15.6s linear infinite}.reveal{animation:reveal 5.2s steps(40,end) infinite}.cursor{animation:cursor 5.2s steps(40,end) infinite}.caret{animation:blink .8s step-end infinite}@media(prefers-reduced-motion:reduce){.line,.reveal,.cursor,.caret{animation:none}.line:first-of-type{opacity:1}.reveal{width:var(--line-width)}.cursor{display:none}}</style><defs><clipPath id="clip-0"><rect class="reveal" x="267.8" y="8" width="224.39999999999998" height="42" style="--line-width:224.39999999999998px"/></clipPath></defs><g class="line" style="animation-delay:0s"><g clip-path="url(#clip-0)"><text x="380" y="37" text-anchor="middle" textLength="224.39999999999998" lengthAdjust="spacingAndGlyphs" font-family="Fira Code,Consolas,Liberation Mono,monospace" font-size="22" fill="#FDD879">Hi, I&apos;m MelonPika</text></g><g class="cursor" style="--line-width:224.39999999999998px"><text class="caret" x="267.8" y="37" font-family="monospace" font-size="22" fill="#FFB6C1">▏</text></g></g><defs><clipPath id="clip-1"><rect class="reveal" x="155.60000000000002" y="8" width="448.79999999999995" height="42" style="--line-width:448.79999999999995px"/></clipPath></defs><g class="line" style="animation-delay:5.2s"><g clip-path="url(#clip-1)"><text x="380" y="37" text-anchor="middle" textLength="448.79999999999995" lengthAdjust="spacingAndGlyphs" font-family="Fira Code,Consolas,Liberation Mono,monospace" font-size="22" fill="#B4F5FD">A cozy corner for code &amp; curiosity</text></g><g class="cursor" style="--line-width:448.79999999999995px"><text class="caret" x="155.60000000000002" y="37" font-family="monospace" font-size="22" fill="#FFB6C1">▏</text></g></g><defs><clipPath id="clip-2"><rect class="reveal" x="76.40000000000003" y="8" width="607.1999999999999" height="42" style="--line-width:607.1999999999999px"/></clipPath></defs><g class="line" style="animation-delay:10.4s"><g clip-path="url(#clip-2)"><text x="380" y="37" text-anchor="middle" textLength="607.1999999999999" lengthAdjust="spacingAndGlyphs" font-family="Fira Code,Consolas,Liberation Mono,monospace" font-size="22" fill="#FDFBF6">Small steps, pastel skies &amp; little experiments</text></g><g class="cursor" style="--line-width:607.1999999999999px"><text class="caret" x="76.40000000000003" y="37" font-family="monospace" font-size="22" fill="#FFB6C1">▏</text></g></g></svg>
