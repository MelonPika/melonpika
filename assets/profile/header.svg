<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-labelledby="title description">
<title id="title">MelonPika&apos;s profile header</title>
<desc id="description">A vibrant golden, coral, and sky-blue header with sparkling stars and three soft, sweeping pastel waves.</desc>
<defs>
<linearGradient id="sunrise" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#FFE16B"/>
<stop offset=".42" stop-color="#FF9EBD"/>
<stop offset=".72" stop-color="#B8ACFF"/>
<stop offset="1" stop-color="#61DFFF"/>
</linearGradient>
<linearGradient id="wave-back" x1="0" y1="0" x2="1" y2="0">
